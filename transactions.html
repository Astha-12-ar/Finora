<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finora - Transactions</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h2 class="logo">Finora</h2>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="transactions.html" class="nav-link active">Transactions</a>
        <a href="alerts.html" class="nav-link">Alerts</a>
        <a href="reminders.html" class="nav-link">Reminders</a>
      </nav>
      <button id="logoutBtn" class="logout-btn">Log Out</button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Transactions</h1>
      </header>

      <!-- Filter/Search Controls -->
      <section class="filters">
        <input type="text" id="searchInput" placeholder="Search merchant or category...">

        <select id="categoryFilter">
          <option value="all">All Categories</option>
        </select>

        <select id="sortBy">
          <option value="date-desc">Date (Newest)</option>
          <option value="date-asc">Date (Oldest)</option>
          <option value="amount-desc">Amount (High to Low)</option>
          <option value="amount-asc">Amount (Low to High)</option>
        </select>
      </section>

      <!-- Transactions Table -->
      <section class="panel">
        <table class="transactions-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Merchant</th>
              <th>Category</th>
              <th>Status</th>
              <th class="text-right">Amount</th>
            </tr>
          </thead>
          <tbody id="transactionsTableBody"></tbody>
        </table>
        <p id="noResults" class="no-results" style="display:none;">No transactions found.</p>
      </section>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
