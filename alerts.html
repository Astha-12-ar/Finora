<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finora - Alerts</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h2 class="logo">Finora</h2>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="transactions.html" class="nav-link">Transactions</a>
        <a href="alerts.html" class="nav-link active">Alerts</a>
        <a href="reminders.html" class="nav-link">Reminders</a>
      </nav>
      <button id="logoutBtn" class="logout-btn">Log Out</button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Alerts</h1>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h3>All Alerts</h3>
          <div class="alert-controls">
            <!-- Added title and aria-label to fix the accessibility error -->
            <select id="typeFilter" title="Filter by alert type" aria-label="Filter by alert type">
              <option value="all">All Types</option>
              <option value="large_transaction">Large Transaction</option>
              <option value="low_balance">Low Balance</option>
              <option value="upcoming_bill">Upcoming Bill</option>
              <option value="unusual_spending">Unusual Spending</option>
            </select>
            <button id="markAllReadBtn" class="secondary-btn">Mark All Read</button>
          </div>
        </div>
        <ul id="alertsList" class="list"></ul>
        <!-- Removed inline style="display:none;" and added 'hidden' class to fix CSS warning -->
        <p id="noAlerts" class="no-results hidden">No alerts found.</p>
      </section>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/alerts.js"></script>
</body>
</html>
